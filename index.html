<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>派對飛行棋</title>
  <link rel="stylesheet" href="style.css?v=10" />
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="title-block">
        <h1>派對飛行棋</h1>
        <div class="subtitle">情侶對戰 · 旋轉骰子 · 抽任務喝一杯</div>
      </div>
      <div class="badge-beta">PROTOTYPE</div>
    </header>

    <!-- Step 1: select pairs -->
    <section id="step-pairs" class="section">
      <div class="card">
        <label for="pair-count">選擇對數（1 ～ 4 對）：</label>
        <select id="pair-count">
          <option value="1">1 對（2 人）</option>
          <option value="2">2 對（4 人）</option>
          <option value="3">3 對（6 人）</option>
          <option value="4">4 對（8 人）</option>
        </select>
        <div style="margin-top:8px; display:flex; justify-content:flex-end;">
          <button id="btn-start-names">下一步：設定指令強度</button>
        </div>
      </div>
    </section>

    <!-- Step 1.5: command level settings -->
    <section id="step-settings" class="section hidden">
      <div class="card">
        <div style="font-size:14px; margin-bottom:6px;">指令主題：</div>
        <div style="font-size:13px; color:#9ca3af; margin-bottom:6px;">
          喝酒聊天 · KTV 互動 · 親密玩樂
        </div>
        <select id="level-mode">
          <option value="A">喝酒聊天</option>
          <option value="AB" selected>KTV 互動</option>
          <option value="BC">親密玩樂</option>
        </select>
        <label for="interaction-mode">互動對象：</label>
        <select id="interaction-mode">
          <option value="partner" selected>只跟自己伴侶</option>
          <option value="cross">允許跨組互動</option>
        </select>
        <div class="safety-notice">
          本遊戲限成年人參加。所有互動都必須經雙方同意；任何人可無條件跳過或改做替代動作，不需要說明原因。
        </div>
        <div style="margin-top:8px; display:flex; justify-content:flex-end;">
          <button id="btn-confirm-settings">下一步：輸入名字</button>
        </div>
      </div>
    </section>

    <!-- Step 2: input names -->
    <section id="step-names" class="section hidden">
      <div class="card">
        <div id="name-instruction" style="font-size:14px; margin-bottom:4px;"></div>
        <label id="name-label" for="name-input">輸入名字：</label>
        <input id="name-input" type="text" maxlength="12" autocomplete="off" />
        <div style="margin-top:8px; display:flex; justify-content:flex-end;">
          <button id="btn-next-name">確認此人，下一位</button>
        </div>
      </div>
    </section>

    <!-- Step 3: confirm players -->
    <section id="step-confirm" class="section hidden">
      <div class="card">
        <div style="font-size:14px; margin-bottom:4px;">玩家列表：</div>
        <div id="player-list" class="player-list"></div>
        <div style="margin-top:8px; display:flex; justify-content:flex-end;">
          <button id="btn-start-game">開始遊戲</button>
        </div>
      </div>
    </section>

    <!-- Step 4: game board -->
    <section id="step-game" class="section hidden">
      <div class="card board-wrapper">
        <div class="play-stage">
          <div class="turn-panel">
            <div class="turn-kicker">現在輪到</div>
            <div id="turn-status" class="status"></div>
            <div id="turn-progress" class="turn-progress" aria-live="polite"></div>
          </div>
          <div class="dice-box">
            <div class="dice-label">點骰子開始</div>
            <button id="dice-face" class="dice-face" type="button" aria-label="擲骰子"></button>
            <div id="roll-result" class="roll-result" aria-live="polite">準備擲骰</div>
          </div>
          <button id="btn-toggle-voice" class="btn-secondary voice-toggle" type="button">
            🔊 語音：開啟
          </button>
        </div>

        <div class="race-panel">
          <div class="race-title">玩家進度</div>
          <div id="progress-list" class="progress-list"></div>
        </div>

        <div class="command-box" id="command-box">
          <div id="command-meta" class="command-meta hidden">
            <span
              id="command-kind-badge"
              class="command-badge command-badge-interaction hidden"
            >
              互動指令
            </span>
            <span
              id="command-level-badge"
              class="command-badge command-badge-level-C hidden"
            >
              🔥 高強度
            </span>
          </div>
          <div id="command-text">指令會出現在這裡</div>
          <div class="command-actions">
            <button id="btn-confirm-task" class="btn-secondary" disabled>完成指令</button>
            <button id="btn-reroll" class="btn-secondary" disabled>重抽指令</button>
            <button id="btn-drink" disabled>喝一杯</button>
          </div>
          <div id="reroll-status" class="reroll-status" aria-live="polite"></div>
        </div>

        <details class="map-details">
          <summary>查看地圖（遊戲時不必一直看）</summary>
          <div class="board-layout">
            <div class="player-panel">
              <div class="legend-title">玩家顏色</div>
              <div id="legend" class="legend"></div>
            </div>
            <div id="board" class="board">
              <div id="board-track" class="board-track"></div>
            </div>
          </div>
        </details>
      </div>
    </section>

    <footer>提示：每回合最多重抽一次；完成、替代或跳過任務後再換下一位。</footer>
  </div>

  <script src="commands.js?v=10"></script>
  <script src="speech.js?v=10"></script>
  <script src="game.js?v=10"></script>
</body>
</html>
